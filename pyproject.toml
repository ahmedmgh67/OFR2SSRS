[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oracle2ssrs"
version = "1.0.4"
description = "Convert Oracle Reports XML exports into SSRS RDL reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Max Casteel" }]
maintainers = [{ name = "Ahmed Gamal" }]
keywords = ["oracle-reports", "ssrs", "rdl", "report-migration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Flask",
    "Topic :: Database",
]
# Everything the app, the CLI and the Preview tab need at runtime.
dependencies = [
    "Flask>=3.1.3",
    "Werkzeug>=3.1.9",
    "lxml>=6.1.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pypdf>=6.21.1",
    "PyMuPDF>=1.28.2,<2",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[project.scripts]
oracle2ssrs = "oracle2ssrs.__main__:main"
oracle2ssrs-convert = "oracle2ssrs.__main__:convert_main"

[project.urls]
Homepage = "https://github.com/ahmedmgh67/OFR2SSRS"
Source = "https://github.com/ahmedmgh67/OFR2SSRS"

# The wheel mirrors the repo layout under oracle2ssrs/ (backend/, frontend/,
# samples/, tools/), so every path the app resolves relative to backend/
# works the same installed as it does in a checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/oracle2ssrs",
    "/backend",
    "/frontend",
    "/samples/oracle",
    "/tools/renderlab",
    "/tools/ssrscheck",
    "/README.md",
    "/LICENSE",
]
exclude = ["__pycache__", "*.pyc", "/tools/renderlab/lib", "/tools/renderlab/out"]

[tool.hatch.build.targets.wheel]
packages = ["oracle2ssrs"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"backend" = "oracle2ssrs/backend"
"frontend" = "oracle2ssrs/frontend"
"samples/oracle" = "oracle2ssrs/samples/oracle"
"tools/renderlab" = "oracle2ssrs/tools/renderlab"
"tools/ssrscheck" = "oracle2ssrs/tools/ssrscheck"
